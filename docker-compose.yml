services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snack_overflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snack_overflow}
      POSTGRES_DB: ${POSTGRES_DB:-snack_overflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snack_overflow} -d ${POSTGRES_DB:-snack_overflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-snack_overflow}:${POSTGRES_PASSWORD:-snack_overflow}@postgres:5432/${POSTGRES_DB:-snack_overflow}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key-please-change-in-production-env}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      ENVIRONMENT: production
      # Idempotent demo seed (admin@snackoverflow.com / member@snackoverflow.com) on first boot
      SEED_DB: ${SEED_DB:-true}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000
        VITE_WS_BASE_URL: ws://127.0.0.1:8000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
  uploads:
