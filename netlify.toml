# Netlify Configuration for Snack Overflow Frontend (React + Vite SPA)

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# SPA Fallback: Route all deep links (e.g. /dashboard, /snacks, /admin/scanner) to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
